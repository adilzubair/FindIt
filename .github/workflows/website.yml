name: Website

# Publishes website/ to GitHub Pages at findit.muhamedadil.com.
# Publishing a release also redeploys, so the download links follow the newest release.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/media/findit-demo.mp4'
      - 'src/FindIt.App/Assets/FindIt.ico'
      - '.github/workflows/website.yml'
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install the demo's runtime
        working-directory: website
        run: npm ci --ignore-scripts

      # The demo model is about 90 MB and pinned to one revision, so it is fetched once and reused.
      - uses: actions/cache@v4
        with:
          path: website/.cache/models
          key: demo-model-${{ hashFiles('website/tools/models.mjs') }}

      - name: Assemble site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node website/build.mjs --release

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
