name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  MSBuildEnableWorkloadResolver: 'false'

jobs:
  build-and-test:
    name: Managed build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: .packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'NuGet.Config') }}
          restore-keys: nuget-${{ runner.os }}-

      # Native libraries and models are not built here; tests that need them report inconclusive.
      - name: Build
        run: dotnet build FindIt.slnx -c Release -p:FindItEnableFaultInjection=false

      - name: Build fault-injection worker
        run: dotnet build src/FindIt.Worker/FindIt.Worker.csproj -c Release -p:FindItEnableFaultInjection=true --artifacts-path artifacts/fault-build

      - name: Test
        run: dotnet test tests/FindIt.Tests/FindIt.Tests.csproj -c Release --no-build --logger "trx;LogFileName=findit.trx" --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
